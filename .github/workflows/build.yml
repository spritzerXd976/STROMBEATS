name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk    artifacts/StormBeats-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/StormBeats-release-unsigned.apk || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StormBeats-Debug-APK
          path: artifacts/StormBeats-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StormBeats-Release-APK
          path: artifacts/StormBeats-release-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/StormBeats-debug.apk
            artifacts/StormBeats-release-unsigned.apk
          body: |
            ## StormBeats ${{ github.ref_name }}
            
            ### What's New
            - 🎨 Complete UI redesign — YouTube Music-inspired Material 3
            - 🔴 New red accent theme with deep black background
            - 🎵 Revamped player screen with pill-shaped play/pause button
            - 🏠 New Home screen with mood chips, Quick Picks & Keep Listening sections
            - 📋 Mini player bar with shimmer animation
            - 🔍 Improved Search screen with dividers and better result cards
            - 📚 Library tab added (coming soon)
            - ✨ Smooth animations and micro-interactions throughout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
